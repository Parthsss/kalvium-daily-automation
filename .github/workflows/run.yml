name: Kalvium Daily Report

on:
  schedule:
    - cron: '17 12 * * 1-5'  # 5:47 PM IST, Mon–Fri
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      # GitHub often starts scheduled runs many hours late (seen: 8–12h, landing at 2–5 AM IST).
      # Skip scheduled runs that fall outside the journal window so we never submit at the wrong time.
      # Manual (workflow_dispatch) runs always proceed.
      - name: Check IST time window
        id: guard
        run: |
          echo "Scheduled event: ${{ github.event.schedule }}"
          echo "UTC time: $(date -u)"
          IST_HOUR=$(TZ=Asia/Kolkata date +%H)
          IST_DOW=$(TZ=Asia/Kolkata date +%u)   # 1=Mon … 7=Sun
          echo "IST time: $(TZ=Asia/Kolkata date)"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$IST_DOW" -le 5 ] && [ "$IST_HOUR" -ge 17 ] && [ "$IST_HOUR" -le 23 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Scheduled run started late (IST $(TZ=Asia/Kolkata date +%H:%M), weekday $IST_DOW) — outside the 17:00–23:59 Mon–Fri window. Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4.2.2
        if: steps.guard.outputs.ok == 'true'

      - uses: actions/setup-node@v4.1.0
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 18

      - run: npm install
        if: steps.guard.outputs.ok == 'true'
      - run: npx playwright install chromium
        if: steps.guard.outputs.ok == 'true'

      - name: Run automation
        if: steps.guard.outputs.ok == 'true'
        run: set -o pipefail; npm start 2>&1 | tee automation.log
        env:
          AUTH_STATE: ${{ secrets.AUTH_STATE }}
        id: automation

      - name: Check if auth expired
        id: auth_check
        if: failure() && steps.automation.outcome == 'failure'
        run: |
          if grep -q "Not logged in" automation.log; then
            echo "::error::Authentication expired. Please regenerate auth.json and update AUTH_STATE secret."
            echo "expired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug-*.png
            debug-page.html
            automation.log
          retention-days: 7

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.auth_check.outputs.expired == 'true' && '🔐 Kalvium login EXPIRED - journal not submitted' || '❌ Kalvium Daily Report FAILED' }}
          to: ${{ secrets.EMAIL_TO }}
          from: Kalvium Automation <${{ secrets.EMAIL_USERNAME }}>
          body: |
            ❌ Kalvium daily automation failed. Today's journal was NOT submitted.
            ${{ steps.auth_check.outputs.expired == 'true' && 'Reason: your Kalvium login session has expired. To fix: run `node login.js`, then update the secret with: node -e "process.stdout.write(JSON.stringify(require(''./auth.json'')))" | gh secret set AUTH_STATE' || '' }}
            Repo: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}
            Run link:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
